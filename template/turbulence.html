<html>
<head>
	<script src="jquery.min.js"></script>
	<script src="highcharts.js"></script>
	<script src="cc.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      font-size: 1.5em;
      margin-bottom: 0.5em;
    }
    .tip {
      margin-top: 15px;
      padding: 10px 15px;
      background: #fffbe6;
      border-left: 4px solid #f90;
      font-size: 13px;
      max-width: 900px;
    }
  </style>
  <script>
$(document).ready(function() {
   var chart = new Highcharts.Chart({
      chart: {
         renderTo: 'container',
         defaultSeriesType: 'scatter',
         zoomType: 'xy',
         backgroundColor: '#fff'
      },
      title: {
         text: null
      },
      colors: ['#4572A7', '#AA4643', '#89A54E', '#80699B', '#3D96AE', '#DB843D', '#92A8CD', '#A47D7C', '#B5CA92'],
      xAxis: {
         title: {
            enabled: true,
            text: 'Churn'
         },
         startOnTick: false,
         endOnTick: false,
         minPadding: 0.02,
         maxPadding: 0.02,
         labels: {enabled:false},
         lineWidth: 0,
         tickWidth: 0
      },
      yAxis: {
         title: {
            text: 'Complexity'
          },
         startOnTick: false,
         endOnTick: false,
         minPadding: 0.02,
         maxPadding: 0.05,
         labels: {enabled:false}
      },
      tooltip: {
        formatter: function() {
          var item = this.point;
          return item.filename + "<br/>" + "churn: " + item.x + "<br/>" + "complexity: " + item.y;
        }
      },

      plotOptions: {
         scatter: {
            marker: {
               radius: 5,
               states: {
                  hover: {
                     enabled: true,
                     radius: 7,
                     lineColor: 'rgb(100,100,100)'
                  }
               }
            }
         }
      }
   });

   $.each(directorySeries, function(directory) {
     chart.addSeries({
      name: directory,
      type: 'scatter',
      visible: true,
      data: directorySeries[directory]
     });
   });
});

  </script>
</head>
<body>
  <h1>Churn vs Complexity</h1>
  <div id='container' style="width: 900px; height: 500px;"></div>
  <div class="tip">
    <strong>Tip:</strong> Files in the <strong>upper right</strong> (high churn + high complexity) are prime candidates for refactoring.
    Click and drag to zoom, click the legend to toggle directories.
  </div>
</body>
</html>
